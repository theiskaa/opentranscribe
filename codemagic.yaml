# Codemagic CI for opentranscribe.
#
# Security model for this PUBLIC repo:
#   - Nothing secret lives here. This file only REFERENCES variables and an App
#     Store Connect integration; every value lives in Codemagic (encrypted env
#     groups + the Developer Portal integration), never in git.
#   - The release workflow runs ONLY on version tags, so a pull request (from a
#     fork or otherwise) can never run with secrets in scope. PR validation runs
#     in a separate, secret-less workflow.
#
# Owner fills two placeholders below (marked TODO): the App Store Connect
# integration name, and confirming the Flutter version matches the channel.

workflows:
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # The App Store Connect API key name from Codemagic > Team integrations >
      # Developer Portal. Must match exactly (quoted because it has a space).
      app_store_connect: "OpenTranscribe Codemagic"
    environment:
      groups:
        # Encrypted group holding STORAGE_KEY (secure, 32 chars) and
        # APP_STORE_APPLE_ID (the numeric App Store app id; not secret).
        - app_secrets
      # Signing files are CREATED explicitly in the scripts below (the declarative
      # ios_signing block only fetches pre-existing ones). fetch-signing-files
      # --create mints the distribution certificate and App Store profile using
      # the CERTIFICATE_PRIVATE_KEY env var (from the app_secrets group).
      flutter: &flutter_version 3.44.4 # one pin for both workflows; matches channel custom_stable
      xcode: latest
    # No automatic triggering: this workflow is started ON DEMAND from the
    # Codemagic UI ("Start new build" -> pick this workflow + the main branch).
    # Each run queries TestFlight and ships the next build number app-wide, so
    # builds climb 1, 2, 3... across every version and a bump in pubspec.yaml
    # never restarts the count. No version bump and no git tag are required to
    # ship again.
    # Because nothing here fires on a PR, secrets are never exposed to fork code.
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      # Vendored packages/liquid keeps its arrival formatting (see its
      # analysis_options.yaml); the first-party packages take the app's rules,
      # so only liquid is skipped here.
      - name: Check formatting
        script: >-
          dart format --output=none --set-exit-if-changed
          lib test packages/transcriber packages/reflections
      - name: Test
        # set -e so an early suite's failure fails the step; without it a
        # multi-line script reports only the last line's exit code.
        script: |
          set -e
          flutter test
          (cd packages/transcriber && flutter test)
          (cd packages/reflections && flutter test)
          (cd packages/liquid && flutter test)
      - name: Set up keychain
        script: keychain initialize
      - name: Create or fetch the App Store signing files
        # One profile per target: the Live Activity widget extension
        # (xyz.opentranscribe.RecorderActivity) is signed separately from the app,
        # so it needs its own App ID + profile or the archive fails to sign it.
        script: |
          app-store-connect fetch-signing-files "xyz.opentranscribe" \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create
          app-store-connect fetch-signing-files "xyz.opentranscribe.RecorderActivity" \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create
      - name: Add the certificate to the keychain
        script: keychain add-certificates
      - name: Apply the provisioning profile to the Xcode project
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: |
          # Version (build-name) is the source of truth in pubspec.yaml, e.g.
          # "version: 0.2.0+1" -> 0.2.0; the "+1" is for local builds only and
          # is ignored here.
          #
          # get-latest-build-number, NOT the testflight one: it spans App Store
          # and TestFlight together, so a build already released (and no longer
          # listed in TestFlight) still counts and cannot be handed out twice.
          # --all-versions drops the default "highest version" scoping, which
          # would restart the count at 1 the first time a version bump ships.
          # Anything but a number here is a broken lookup (--all-versions needs
          # cli-tools 0.67.0, the action itself 0.35.0; credentials can lapse),
          # and a build number guessed from a broken lookup uploads as the
          # wrong build. Refuse instead, with the CLI version already in the log
          # to say which it was.
          BUILD_NAME=$(grep '^version:' pubspec.yaml | head -1 | sed -E 's/version:[[:space:]]*//; s/\+.*//')
          app-store-connect --version
          LATEST=$(app-store-connect get-latest-build-number --all-versions --platform IOS "$APP_STORE_APPLE_ID")
          case "$LATEST" in
            '' | *[!0-9]*)
              echo "Latest build number lookup answered '$LATEST'; refusing to guess"
              exit 1
              ;;
          esac
          BUILD_NUMBER=$(( LATEST + 1 ))
          echo "Building $BUILD_NAME ($BUILD_NUMBER)"
          flutter build ipa --release \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=STORAGE_KEY="$STORAGE_KEY" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # beta_groups:            # uncomment and name a group to auto-distribute
        #   - Internal testers

  pr-checks:
    name: PR checks (no secrets)
    instance_type: mac_mini_m2
    max_build_duration: 30
    # Deliberately NO integrations, NO groups, NO ios_signing: this workflow has
    # zero secrets, so it is safe to run against untrusted pull requests.
    environment:
      flutter: *flutter_version
    triggering:
      events:
        - pull_request
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      # Vendored packages/liquid keeps its arrival formatting (see its
      # analysis_options.yaml); the first-party packages take the app's rules,
      # so only liquid is skipped here.
      - name: Check formatting
        script: >-
          dart format --output=none --set-exit-if-changed
          lib test packages/transcriber packages/reflections
      - name: Test
        # set -e so an early suite's failure fails the step; without it a
        # multi-line script reports only the last line's exit code.
        script: |
          set -e
          flutter test
          (cd packages/transcriber && flutter test)
          (cd packages/reflections && flutter test)
          (cd packages/liquid && flutter test)
