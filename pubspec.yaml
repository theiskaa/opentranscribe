name: opentranscribe
description: "A private, offline voice journal. Nothing leaves your phone."
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  flutter_bloc: ^9.1.1
  go_router: ^17.3.0
  # Native UIKit chrome (real Liquid Glass buttons and menus on iOS 26) behind
  # platform views; renders locally, no network. Vendored under packages/ rather
  # than pulled from pub: this is the one dependency that reaches UIKit
  # directly, and the one rule means we own that code rather than tracking
  # someone else's releases of it.
  liquid:
    path: packages/liquid

  shared_preferences: ^2.5.4
  encrypt: ^5.0.3
  lottie: ^3.3.2
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  # The Material icon font is unused; keep it out of the bundle.
  uses-material-design: false

  assets:
    - assets/animations/
    - assets/brand/

  fonts:
    - family: sficons
      fonts:
        - asset: assets/icons/sficons.ttf
