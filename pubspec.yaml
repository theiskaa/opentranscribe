name: opentranscribe
description: "A private, offline voice journal. Nothing leaves your phone."
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  flutter_bloc: ^9.1.1
  go_router: ^17.3.0

  shared_preferences: ^2.5.4
  encrypt: ^5.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
