name: reflections
description: On-device reflection generation behind a swappable engine contract.
version: 1.0.0
publish_to: "none"

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: ReflectionEnginePlugin

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
