name: transcriber
description: Audio capture, playback, and on-device transcription behind swappable engine contracts.
version: 1.0.0
publish_to: "none"

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

dependencies:
  crypto: ^3.0.7
  ffi: ^2.2.0
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: TranscriberPlugin

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
